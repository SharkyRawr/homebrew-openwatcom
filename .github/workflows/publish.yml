name: Build and Publish Bottles

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-bot:
    strategy:
      matrix:
        os:
          - macos-26      # Apple Silicon (latest)
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Ruby Bundler gems
        run: brew install-bundler-gems

      - name: Build and test formula
        run: |
          VERSION=$(grep -E '^  version "' Formula/openwatcom-v2.rb | sed 's/.*"\(.*\)".*/\1/')
          brew test-bot --tap=sharkyrawr/openwatcom --root-url="https://github.com/SharkyRawr/homebrew-openwatcom/releases/download/openwatcom-v2-${VERSION}" openwatcom-v2

      - name: Upload bottles
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ matrix.os }}
          path: '*.bottle.*'

  publish:
    needs: test-bot
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Download all bottles
        uses: actions/download-artifact@v4
        with:
          path: bottles
          pattern: bottles-*
          merge-multiple: true

      - name: Merge bottle block into formula
        run: |
          shopt -s nullglob
          json_files=(bottles/*.bottle.json)
          if [ ${#json_files[@]} -eq 0 ]; then
            echo "No bottle JSON files found, skipping bottle merge."
            exit 0
          fi
          brew bottle --merge --write --no-commit --no-all-checks "${json_files[@]}"

      - name: Rename bottle files to match Homebrew URL encoding
        run: |
          for json in bottles/*.bottle.json; do
            local_name=$(jq -r 'to_entries[0].value.bottle.tags[].local_filename' "$json")
            remote_name=$(jq -r 'to_entries[0].value.bottle.tags[].filename' "$json")
            if [ -n "$local_name" ] && [ -n "$remote_name" ] && [ -f "bottles/$local_name" ]; then
              mv "bottles/$local_name" "bottles/$remote_name"
              echo "Renamed $local_name -> $remote_name"
            fi
          done

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -E '^  version "' Formula/openwatcom-v2.rb | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwatcom-v2-${{ steps.version.outputs.version }}
          name: openwatcom-v2 ${{ steps.version.outputs.version }}
          files: bottles/*.bottle.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add Formula/openwatcom-v2.rb
          if git diff --cached --quiet; then
            echo "No bottle changes to commit."
          else
            git commit -m "openwatcom-v2: update ${{ steps.version.outputs.version }} bottle. [skip ci]"
            git push origin main
          fi
